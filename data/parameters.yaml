      date: "2026-07/2026-09"
      latex_string: dptwodate
      color: TLOrange3
      dptwocutoffdate: "2026-01-09"
      sub_releases:
        - key: EDP2
          name: "Early Data Preview 2"
          date: "2026-07"
          latex_string: edptwodate
          description: "LSSTCam Science Validation Data"

        - key: DP2
