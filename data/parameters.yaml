# RTN-011 milestone and event parameters.
# Edit these values to update all fields the document.
#
# Valid Date formats:
#   YYYY-MM-DD  full date
#   YYYY-MM     month only
#   YYYY-MM/YYYY-MM  date range (ISO 8601 interval)
#   TBD         date not yet determined
#
# Appropriate date formats for use in the document will be generated during the build
#
# ---------------------------------------------------------------------------
#  Milestones
# ---------------------------------------------------------------------------
milestones:
  startsvcoomcam: "2024-10-24"
  finsvcomcam: "2024-12-11"
  ccfpdate: "2025-10-24"
  cstrcompdate: "2025-10-24"
  lcfpdate: "2025-04-15"
  startsv: "2025-06-20"
  finonskylsstcam: "2025-09-21"
  startsciencelsstcam: "2025-04-17"
  startonskylsstcam: "2025-04-15"
  cameraontma: "2025-03-05"
  rfldate: "2025-06-23"
  opsstartdate: "2025-10-25"
  lsststartdate: "TBD"

# ---------------------------------------------------------------------------
# Data and service release events (datarelease, prompt):
#  key:                  short code shown in the ops timeline table
#  name:                 event name shown in the ops timeline table
#  date:                 date dict; any field with value+latex_string emits a \newcommand
#    value:              ISO 8601 date or date range
#    latex_string:       LaTeX \newcommand name for this date
#  color:                LaTeX color for timeline cell (omit to exclude from timeline)
#  description:          short dataset description for DR scenario column header
#  date_label:           overrides the date display in the DR scenario header (e.g. TBD dates)
#  sub_releases:         child releases shown in DR scenario in place of the parent
#  data_product_status:  1D array of T/S/X, one per entry in products (omit on parents with sub_releases)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  Data Releases (DP and DR events)
# ---------------------------------------------------------------------------
datarelease:

  # Product row order for the DR scenario table.  The data_product_status arrays on
  # each event follow this exact order (position 0 = first product, etc.).
  products:
    - "Raw Images"
    - "DRP Processed Visit Images"
    - "DRP Deep Coadded Images"
    - "DRP Difference Images"
    - "DRP Template Coadd Images"
    - "DRP Source Catalogs"
    - "DRP Object Catalogs"
    - "DRP ForcedSource Catalogs"
    - "DRP ShearObject Catalog"
    - "DRP DIA Catalogs"
    - "DRP SSP Catalogs"
    - "MPC Orbits Catalog"

  events:

    - key: DP0
      name: "Data Preview 0.1/2/3"
      date:
        value: "2023-06-30"
        latex_string: dpzerodate
      color: RubinDarkTeal
      sub_releases:
        - key: DP0.1
          name: "Data Preview 0.1"
          date:
            value: "2021-06"
            latex_string: dpzeropointonedate
          description: "DC2 Simulated Sky Survey"
          #                    Raw  PVI  DCI  DIF  TCI  SRC  OBJ  FRC  SHR  DIA  SSP  MPC
          data_product_status: [T,   T,   T,   X,   X,   T,   T,   T,   X,   X,   X,   X]

        - key: DP0.2
          name: "Data Preview 0.2"
          date:
            value: "2022-06"
            latex_string: dpzeropointtwodate
          description: "Reprocessed DC2 Sky Survey"
          #                    Raw  PVI  DCI  DIF  TCI  SRC  OBJ  FRC  SHR  DIA  SSP  MPC
          data_product_status: [T,   T,   T,   T,   T,   T,   T,   T,   X,   T,   X,   X]

        - key: DP0.3
          name: "Data Preview 0.3"
          date:
            value: "2023-06"
            latex_string: dpzeropointthreedate
          description: "Solar System PPDB Simulation"
          #                    Raw  PVI  DCI  DIF  TCI  SRC  OBJ  FRC  SHR  DIA  SSP  MPC
          data_product_status: [X,   X,   X,   X,   X,   X,   X,   X,   X,   X,   T,   X]

    - key: DP1
      name: "Data Preview 1"
      date:
        value: "2025-06-30"
        latex_string: dponedate
      color: RubinDarkTeal
      description: "LSST ComCam Science Validation Data"
      #                    Raw  PVI  DCI  DIF  TCI  SRC  OBJ  FRC  SHR  DIA  SSP  MPC
      data_product_status: [T,   T,   T,   T,   X,   T,   T,   T,   X,   T,   T,   T]

    - key: DP2
      name: "Data Preview 2"
      date:
        value: "2026-07/2026-09"
        latex_string: dptwodate
      color: TLOrange3
      science_visit_start_date:
        value: "2025-04-24"
        latex_string: dptwostartdate
      cutoff_date:
        value: "2026-01-09"
        latex_string: dptwocutoffdate
      sub_releases:
        - key: EDP2
          name: "Early Data Preview 2"
          date:
            value: "2026-07/2026-09"
            latex_string: edptwodate
          description: "LSSTCam Science Validation Data"
          #                    Raw  PVI  DCI  DIF  TCI  SRC  OBJ  FRC  SHR  DIA  SSP  MPC
          data_product_status: [X,   X,   T,   X,   X,   T,   T,   T,   T,   T,   T,   T]

        - key: DP2
          name: "Data Preview 2"
          date:
            value: "2026-09/2026-10"
