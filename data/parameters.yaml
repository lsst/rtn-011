# RTN-011 milestone and event parameters.
# Edit these values to update all fields the document.
#
# Valid Date formats:
#   YYYY-MM-DD  full date
#   YYYY-MM     month only
#   YYYY-MM/YYYY-MM  date range (ISO 8601 interval)
#   TBD         date not yet determined
#
# Appropriate date formats for use in the document will be generated during the build
#
# ---------------------------------------------------------------------------
#  Milestones
# ---------------------------------------------------------------------------
milestones:
  startsvcoomcam: "2024-10-24"
  finsvcomcam: "2024-12-11"
  ccfpdate: "2025-10-24"
  cstrcompdate: "2025-10-24"
  lcfpdate: "2025-04-15"
  startsv: "2025-06-20"
  finonskylsstcam: "2025-09-21"
  startsciencelsstcam: "2025-04-17"
  startonskylsstcam: "2025-04-15"
  cameraontma: "2025-03-05"
  rfldate: "2025-06-23"
  opsstartdate: "2025-10-25"
  lsststartdate: "TBD"

# ---------------------------------------------------------------------------
# Data and service release events (datarelease, prompt):
#  key:                  short code shown in the ops timeline table
#  name:                 event name shown in the ops timeline table
#  date:                 ISO 8601 date or date range
#  latex_string:         LaTeX \newcommand name generated for this date
#  color:                LaTeX color for timeline cell (omit to exclude from timeline)
#  description:          short dataset description for DR scenario column header
#  date_label:           overrides the date display in the DR scenario header (e.g. TBD dates)
#  sub_releases:         child releases shown in DR scenario in place of the parent
#  <name>:               any other field is treated as an extra latex_string: date pair
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  Data Releases (DP and DR events)
# ---------------------------------------------------------------------------
datarelease:
  events:
    - key: DP0
      name: "Data Preview 0.1/2/3"
      date: "2023-06-30"
      latex_string: dpzerodate
      color: RubinDarkTeal
      sub_releases:
        - key: DP0.1
          name: "Data Preview 0.1"
          date: "2021-06"
          latex_string: dpzeropointonedate
          description: "DC2 Simulated Sky Survey"

        - key: DP0.2
          name: "Data Preview 0.2"
          date: "2022-06"
          latex_string: dpzeropointtwodate
          description: "Reprocessed DC2 Sky Survey"

        - key: DP0.3
          name: "Data Preview 0.3"
          date: "2023-06"
          latex_string: dpzeropointthreedate
          description: "Solar System PPDB Simulation"

    - key: DP1
